<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Fundas de iPhone</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="js/main.js" defer></script>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    
</head>
<body>

    <h1>Fundas de iPhone</h1>

    <div id="aviso"></div>

    <section>
        <h2>Nuevo pedido</h2>
        <input type="text" id="cliente" placeholder="Nombre del cliente">
        <input type="number" id="cantidad" value="1">
        <div id="mensaje"></div>
    </section>

    <section>
        <h2>Pedidos</h2>
        <div id="contenedor-pedidos"></div>
        <button class="btn" id="btn-vaciar">Vaciar pedidos</button>
    </section>

    <section>
        <h2>Catalogo</h2>
        <input type="text" id="buscador" placeholder="Buscá por modelo (ej: iPhone 13)">
        <div id="contenedor-catalogo"></div>
    </section>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

</body>
</html>
